name: Shipping CI - Bai 10

on:
  push:
    branches: [main]
    paths:
      - 'Bai10-Broken-Pipeline/**'
      - '.github/workflows/shipping-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Bai10-Broken-Pipeline/**'
      - '.github/workflows/shipping-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shipping-verify:
    name: shipping-verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bai10-Broken-Pipeline
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and run all tests
        run: mvn --batch-mode --no-transfer-progress -DfailIfNoTests=true clean verify
